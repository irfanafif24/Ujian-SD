            const rsUH = uhSel === 'all' ? inMapel : inMapel.filter(r => String(r.uh) === uhSel);
            const clsOf = (r) => String(r.cls || '-').trim();
            const clsList = [...new Set(inMapel.map(clsOf))].sort((a, b) => a.localeCompare(b, 'id', { numeric: true }));
            const clsSel = state.mapelCls && state.mapelCls !== 'all' && clsList.includes(state.mapelCls) ? state.mapelCls : 'all';
            const rs = (clsSel === 'all' ? rsUH : rsUH.filter(r => clsOf(r) === clsSel)).sort((a, b) => (Number(a.uh) || 0) - (Number(b.uh) || 0) || (b.score || 0) - (a.score || 0));
            const sc = rs.map(r => r.score || 0);
            const avg = rs.length ? Math.round(sc.reduce((a, b) => a + b, 0) / rs.length * 10) / 10 : '-';
            const hi = rs.length ? Math.max(...sc) : '-', lo = rs.length ? Math.min(...sc) : '-';
            const label = (uhSel === 'all' ? 'Semua Ulangan Harian' : 'Ulangan Harian ke-' + uhSel) + (clsSel === 'all' ? ' · Semua Kelas' : ' · Kelas ' + clsSel);
            const kRows = [...new Set(rsUH.map(clsOf))].sort((a, b) => a.localeCompare(b, 'id', { numeric: true })).map(c => {
                const x = rsUH.filter(r => clsOf(r) === c).map(r => r.score || 0), ok = x.filter(v => v >= 70).length;
                return `<tr>${td('<b>' + esc(c) + '</b>')}${td(x.length)}${td(Math.round(x.reduce((p, q) => p + q, 0) / x.length * 10) / 10)}${td(Math.max(...x))}${td(Math.min(...x))}${td(ok + ' (' + Math.round(ok / x.length * 100) + '%)')}</tr>`;

        // Alarm sirene (Web Audio) + layar peringatan merah

        const CHEAT_CONFIRM_MS = 1500;   // halaman harus tetap "pergi" selama ini sebelum dihitung

        const SV = (b) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" font-family="Arial,sans-serif"><rect width="400" height="300" fill="#fff"/>${b}</svg>`;

        // ===== Akhir fitur tambahan =====


        // ===== Mesin Pembuat Soal (offline, berbasis aturan) =====
        const GEN_NAMA = ['Budi', 'Siti', 'Ani', 'Rudi', 'Dina', 'Joko', 'Maya', 'Dewi', 'Andi', 'Rina'];

        const GEN_ADD = [[10, 20, 50], [50, 100, 500], [200, 1000, 5000], [1000, 10000, 50000], [10000, 100000, 500000], [100000, 1000000, 5000000]];
        const GEN_MUL = [[[5, 2], [5, 5], [10, 5]], [[5, 5], [10, 5], [10, 10]], [[10, 10], [20, 10], [50, 10]], [[20, 10], [100, 10], [100, 20]], [[100, 10], [100, 20], [1000, 50]], [[100, 20], [1000, 20], [1000, 100]]];

        const gR = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

        const gShuffle = (a) => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = gR(0, i); [r[i], r[j]] = [r[j], r[i]]; } return r; };

        function gNumDist(ans, n = 3) {

        const GEN_TOPICS = {

            campuran: { label: 'Operasi Hitung Campuran', min: 3, gen: (g, d) => {
                const k = g >= 5 ? 2 : 1; let l, ans;
                if (d === 0) { const a = gR(2, 20 * k), b = gR(2, 9), c = gR(2, 9); l = `${a} + ${b} × ${c}`; ans = a + b * c; }
                else if (d === 1) { const a = gR(2, 20 * k), b = gR(2, 20 * k), c = gR(2, 9); l = `(${a} + ${b}) × ${c}`; ans = (a + b) * c; }
                else { const a = gR(10, 50 * k), b = gR(2, 9), c = gR(2, 9), e = gR(1, a); l = `${a} + ${b} × ${c} − ${e}`; ans = a + b * c - e; }

            pecahan: { label: 'Pecahan (+ dan −)', min: 3, gen: (g, d) => {

                let d1, d2;

        function genRedo(i) {

        function wordTemplate() {

                const bin = atob(WORD_TPL_B64), u = new Uint8Array(bin.length);

        // rows.imgs[i] = { img: gambar soal, oimg: [gambar tiap pilihan] } sejajar dengan rows[i]
        function wordRows(xml) {
            const rows = [['Tipe', 'Mapel', 'UH', 'Kelas', 'Bacaan', 'Pertanyaan'].concat([...Array(12)].map((_, i) => 'Opsi ' + (i + 1)), ['Kunci', 'Pengecoh'])];
            rows.names = ['']; rows.sampleCount = 0; rows.imgs = [null]; rows.lostImgs = 0;
            let mp = '', uh = '', kl = '', cur = null, field = null, cnt = 0, lastOpt = -1;
            const flush = () => {
                const c = cur; cur = null; field = null; lastOpt = -1;
                if (!c) return;
                const has = c.t.trim() || c.k.trim() || c.d.trim() || c.o.some(x => x && x.trim()) || c.pr.length || c.img || c.oimg.some(Boolean);
                if (!has) return;
                if (c.sample) { rows.sampleCount++; return; }
                const opts = (c.ty === 'MJ' || c.ty === 'FL') ? c.pr : [...Array(12)].map((_, i) => c.o[i] || '');
                rows.push([c.ty, mp, uh, kl, c.tx.trim(), c.t.trim()].concat([...Array(12)].map((_, i) => opts[i] || ''), [c.k.trim(), c.d.trim()]));
                rows.imgs.push({ img: c.img, oimg: c.oimg });
                rows.names.push('Soal ke-' + (++cnt) + ' [' + c.ty + ']');
            };
            wordParas(xml).forEach(p => {
                if (p.h) { flush(); return; }
                p.text.split('\n').forEach(raw => {
                    const s = raw.replace(/\u00a0/g, ' ').trim();
                    if (!s) return;
                    let m;
                    if ((m = s.match(/^\[\s*(contoh\s+)?(pg|pk|is|dd|mj|fl)\s*\]/i))) { flush(); cur = { ty: m[2].toUpperCase(), sample: !!m[1], t: '', tx: '', o: [], pr: [], k: '', d: '', img: '', oimg: [] }; return; }
                    if ((m = s.match(/^(mapel|uh|kelas)\s*[:：]\s*(.*)$/i))) {
                        flush(); const key = m[1].toLowerCase(), v = m[2].trim(), d = v.match(/\d+/);
                        if (key === 'mapel') mp = v; else if (key === 'uh') uh = d ? d[0] : v; else kl = d ? d[0] : v;
                        return;
                    }
                    if (!cur) return;
                    if ((m = s.match(/^soal\s*[:：]\s*(.*)$/i))) { cur.t = m[1]; field = 't'; return; }
                    if ((m = s.match(/^bacaan\s*[:：]\s*(.*)$/i))) { cur.tx = m[1]; field = 'tx'; return; }
                    if ((m = s.match(/^kunci\s*[:：]\s*(.*)$/i))) { cur.k = m[1]; field = 'k'; return; }
                    if ((m = s.match(/^pengecoh\s*[:：]\s*(.*)$/i))) { cur.d = m[1]; field = 'd'; return; }
                    if (cur.ty === 'PG' || cur.ty === 'PK') {
                        if ((m = s.match(/^([A-Fa-f])\s*[.)]\s*(.*)$/))) { lastOpt = m[1].toUpperCase().charCodeAt(0) - 65; cur.o[lastOpt] = m[2].trim(); field = 'o'; return; }
                    } else if (cur.ty === 'MJ' || cur.ty === 'FL') {
                        const x = s.replace(/^\d+\s*[.)]\s*/, '');
                        let k = x.indexOf('=>'), w = 2; if (k < 0) { k = x.indexOf('='); w = 1; }
                        if (k >= 0) { const l = x.slice(0, k).trim(), r = x.slice(k + w).trim(); if (l || r) cur.pr.push(l + ' => ' + r); field = null; return; }
                    }
                    if (field === 't') cur.t += '\n' + s; else if (field === 'tx') cur.tx += '\n' + s;
                });
                if (p.img) {
                    if (!cur) rows.lostImgs++;
                    else if (field === 'o' && lastOpt >= 0) { if (!cur.oimg[lastOpt]) cur.oimg[lastOpt] = p.img; else rows.lostImgs++; }
                    else if ((field === 't' || field === 'tx' || field === null) && !cur.img) cur.img = p.img;
                    else rows.lostImgs++;
                }
            });
            flush();
            return rows;
        }

        function saveQuestionForm() {
            const fq = state.formQuestion;
            if (!fq.t.trim()) { toast("⚠️ Teks pertanyaan wajib diisi!"); return; }
            if (!fq.mp) { toast("⚠️ Pilih mata pelajaran untuk soal ini!"); return; }
            if (fq.ty === 'dd' && !ddParse(fq.t).ans.length) { toast("⚠️ Beri tanda { } pada kata jawaban, contoh: Ibu ke {pasar}"); return; }
            fq.uh = fq.uh || 1; state.qUH = fq.uh; state.qMapel = fq.mp; if (!fq.kl) delete fq.kl;
            if (fq.ty === 'pk' && (!fq.ks || fq.ks.length === 0)) { toast("⚠️ Pilih minimal 1 kunci jawaban yang benar!"); return; }
            if (fq.ty === 'pkk') {
                const keep = [];
                (fq.o || []).forEach((st, i) => { if (String(st || '').trim()) keep.push({ s: String(st).trim(), k: Number((fq.kv || [])[i]) === 1 ? 1 : 0 }); });
                if (keep.length < 2) { toast("⚠️ Isi minimal 2 pernyataan!"); return; }
                fq.o = keep.map(x => x.s); fq.kv = keep.map(x => x.k);
                if (!Array.isArray(fq.h) || fq.h.length !== 2) fq.h = ['Benar', 'Salah'];
            } else { delete fq.kv; delete fq.h; }
            if ((fq.ty === 'mj' || fq.ty === 'fl') && (!fq.p || fq.p.length === 0)) { toast("⚠️ Masukkan minimal 1 pasangan!"); return; }

            if (fq.ty === 'mj') {
                const used = new Set((fq.p || []).map(x => String(x.r || '').trim()));
                const dc = [];
                (Array.isArray(fq.dc) ? fq.dc : []).forEach(x => { x = String(x || '').trim(); if (x && !used.has(x) && !dc.includes(x)) dc.push(x); });

            } else { delete fq.dc; }

        // ===== Pengaturan waktu: per mata pelajaran, per ulangan harian, per kelas =====
        // Aturan disimpan di config.timeRules = [{ mp, uh, kl, min }]. Nilai kosong = berlaku untuk semua.
        // Jika beberapa aturan cocok, yang paling spesifik dipakai (mapel > ulangan harian > kelas).
        // Jika tidak ada yang cocok, dipakai durasi standar (config.minutes).
        const clsGrade = (c) => { const m = /^\s*(\d+)/.exec(String(c || '')); return m ? m[1] : ''; };
        const clsMatch = (rk, cls) => {
            rk = String(rk || '').trim().toLowerCase(); cls = String(cls || '').trim().toLowerCase();
            if (!rk) return true;
            return rk === cls || (/^\d+$/.test(rk) && clsGrade(cls) === rk);
        };
        function timeRuleFor(mp, uh, cls) {
            let best = null, bs = -1;
            (config.timeRules || []).forEach(r => {
                if (r.mp && r.mp !== mp) return;
                if (r.uh && String(r.uh) !== String(uh)) return;
                if (r.kl && !clsMatch(r.kl, cls)) return;
                const sc = (r.mp ? 4 : 0) + (r.uh ? 2 : 0) + (r.kl ? (/^\d+$/.test(String(r.kl)) ? 1 : 1.5) : 0);
                if (sc > bs) { bs = sc; best = r; }
            });
            return best;
        }
        function examMinutes(mp, uh, cls) {
            const r = timeRuleFor(mp, uh, cls);
            const m = r ? parseInt(r.min) : parseInt(config.minutes);
            return m > 0 ? m : 30;
        }
        function addTimeRule() {

            if (!(rule.min > 0 && rule.min <= 600)) { toast("⚠️ Isi durasi 1–600 menit."); return; }
            config.timeRules = (config.timeRules || []).filter(r => !(String(r.mp || '') === rule.mp && String(r.uh || '') === rule.uh && String(r.kl || '') === rule.kl));
            config.timeRules.push(rule);
            saveSettings(true); toast("✅ Aturan waktu ditambahkan.");
        }

            (config.timeRules || []).splice(i, 1);
            saveSettings(true); toast("🗑️ Aturan waktu dihapus.");
        }

            let b = document.getElementById('net-badge');

        function gs(fn, ...args) {
            if (GAS_NATIVE) return new Promise((resolve, reject) => {
                try { google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args); }
                catch (e) { reject(e); }
            });
            // Hosting statis: text/plain menghindari preflight CORS pada Apps Script
            const once = () => {
                const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), GS_TIMEOUT);
                return fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }), signal: ctl.signal })
                    .then(r => r.json())
                    .then(r => { setNetState(true); if (r && r.error) throw new Error(r.error); return r ? r.data : null; })
                    .finally(() => clearTimeout(tm));
            };
            const netFail = (e) => !/AUTH/.test(errMsg(e)) && (e.name === 'AbortError' || e instanceof TypeError || e instanceof SyntaxError);
            return once().catch(e => {
                if (netFail(e) && GS_READS.includes(fn)) return new Promise(r => setTimeout(r, 1500)).then(once);
                throw e;
            }).catch(e => { if (netFail(e)) setNetState(false); throw e; });

            if (CLOUD.isTeacher) { cloudPollResults(); return; }
            if (state.page !== 'home') return;
            if (tickN % 6 === 0) { loadTeachersFromServer(); if (state.tid) cloudFetchConfig(state.tid); }

        // --- Konfigurasi ujian ---
        function cloudWatchConfig(tid) {
            if (!CLOUD.on || CLOUD.isTeacher) return;
            CLOUD.cfgTid = tid; CLOUD.cfgVer = ''; CLOUD.configExists = false;
            cloudFetchConfig(tid);
        }

        async function cloudFetchConfig(tid) {
            try {
                const r = await gs('getConfig', tid, CLOUD.cfgTid === tid ? CLOUD.cfgVer : '');
                if (tid !== state.tid || CLOUD.isTeacher) return;
                if (!r.exists) { CLOUD.configExists = false; return; }
                CLOUD.configExists = true;
                if (r.same || state.page === 'exam') return; // jangan ubah soal saat ujian berjalan
                CLOUD.cfgTid = tid; CLOUD.cfgVer = r.ver;
                config = fixMapelCfg({ ...r.config });
                if (!Array.isArray(config.questions)) config.questions = [];
                try { localStorage.setItem('ujian_cfg_' + tid, JSON.stringify(config)); } catch (e) {}
                refreshHome();
            } catch (e) { /* abaikan; dicoba lagi pada polling berikutnya */ }
        }

        function cloudSaveConfig(c) {
            if (!CLOUD.on || !CLOUD.isTeacher || !CLOUD.token || state.tid !== CLOUD.tid) return;
            const { pin, ...pub } = c;
            CLOUD.pendingCfg = clean(pub);
            if (CLOUD.cfgBusy) return; // simpan berurutan, selalu versi terbaru
            (async () => {
                CLOUD.cfgBusy = true;
                while (CLOUD.pendingCfg) {
                    const data = CLOUD.pendingCfg; CLOUD.pendingCfg = null;
                    try { const r = await gs('saveConfig', CLOUD.token, data); CLOUD.cfgVer = r.ver; CLOUD.configExists = true; }
                    catch (e) { if (isAuthErr(e)) { cloudSessionExpired(); } else toast("⚠️ Gagal menyimpan ke server. Coba lagi."); }
                }
                CLOUD.cfgBusy = false;
            })();
        }

        // --- Hasil siswa ---
        // Antrean kirim hasil: hasil siswa disimpan di perangkat sampai server menerimanya,
        // lalu dikirim ulang otomatis (saat online kembali, saat halaman dibuka lagi, dan tiap 5 detik).
        const OUTBOX_KEY = 'ujian_outbox';
        const outboxRead = () => { try { return JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]'); } catch (e) { return []; } };
        const outboxWrite = (a) => { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(a)); } catch (e) {} };
        let outboxBusy = false;
        async function outboxFlush() {
            if (!CLOUD.on || outboxBusy || !navigator.onLine) return;
            const q = outboxRead(); if (!q.length) return;
            outboxBusy = true; let sent = 0;
            try {
                for (const it of q) {
                    try {
                        await gs('saveResult', it.uid, it.payload);
                        outboxWrite(outboxRead().filter(x => x.id !== it.id)); sent++;
                    } catch (e) {
                        const net = e && (e.name === 'AbortError' || e instanceof TypeError || e instanceof SyntaxError);
                        if (net) break; // jaringan bermasalah: coba lagi nanti
                        it.tries = (it.tries || 0) + 1; // ditolak server: batasi percobaan agar tidak macet
                        outboxWrite(outboxRead().map(x => x.id === it.id ? it : x).filter(x => (x.tries || 0) < 5));
                    }
                }
            } finally { outboxBusy = false; }
            if (sent) { try { toast('✅ Hasil ulangan berhasil terkirim ke server.'); } catch (e) {} }
        }
        window.addEventListener('online', () => outboxFlush());
        window.addEventListener('beforeunload', (e) => { if (outboxRead().length) { e.preventDefault(); e.returnValue = ''; } });

        function cloudSaveResult(r) {
            if (!CLOUD.on || !CLOUD.uid || CLOUD.isTeacher) return;
            const payload = () => clean({ ...r, uid: CLOUD.uid,
                savedQuestionsOrder: (r.savedQuestionsOrder || []).map(q => ({ oi: q.originalIndex, oo: q._optOrder || null })) });
            const send = () => {
                if (r.status !== 'done') { gs('saveResult', CLOUD.uid, payload()).catch(() => {}); return; }
                outboxWrite(outboxRead().filter(x => x.id !== r.id).concat([{ id: r.id, uid: CLOUD.uid, payload: payload(), tries: 0 }]));
                outboxFlush().then(() => {
                    if (outboxRead().some(x => x.id === r.id)) toast("📡 Hasil tersimpan di perangkat dan akan dikirim otomatis saat koneksi pulih. Jangan hapus data browser.");
                });
            };
            clearTimeout(CLOUD.timers[r.id]);
            if (r.status === 'done') send(); else CLOUD.timers[r.id] = setTimeout(send, 3000);
        }

        async function cloudPollResults(force) {
            if (!CLOUD.on || !CLOUD.isTeacher || !CLOUD.token || pollBusy) return;
            pollBusy = true;
            try {
                const r = await gs('getResults', CLOUD.token, force ? '' : (CLOUD.resSig || ''));

            finally { pollBusy = false; }
        }

        function msSyncPendidik(d) {
            try {
                let ts = JSON.parse(localStorage.getItem('ujian_teachers') || '[]');

                    localStorage.setItem('ujian_siswa_' + t.id, JSON.stringify(d.students.filter(s => cl.has(s.cls)).map(s => ({ nis: s.nis, name: s.name, cls: s.cls, jk: s.jk, ttl: s.ttl }))));

        // --- Penyimpanan lokal (mode tes / tanpa server) ---
        const MSLocal = {
            read() { try { const d = JSON.parse(localStorage.getItem(MS_KEY) || 'null'); if (d && d.admin) return msNorm(d); } catch (e) {} return msNorm({ admin: { username: 'admin', password: 'admin123' } }); },
            write(d) { localStorage.setItem(MS_KEY, JSON.stringify(d)); },
            view(d) {
                if (MS.role === 'admin') return d;
                const me = d.teachers.find(t => t.id === MS.user.id);
                if (!me) return msNorm({});
                const cl = new Set(me.assigns.map(a => a.cls)), keys = new Set(me.assigns.map(a => msKey(a.cls, a.mapel))), g = {};
                Object.keys(d.grades).forEach(k => { if (keys.has(k)) g[k] = d.grades[k]; });
                return { admin: {}, students: d.students.filter(s => cl.has(s.cls)), teachers: [{ id: me.id, name: me.name, username: me.username, assigns: me.assigns }], grades: g };
            },
            async login(u, p) {
                const d = this.read(), lu = u.toLowerCase();
                if (d.admin.username && d.admin.username.toLowerCase() === lu && d.admin.password === p) return { ok: true, role: 'admin', user: { id: 'admin', name: 'Administrator' } };
                const t = d.teachers.find(x => String(x.username).toLowerCase() === lu && x.password === p);
                return t ? { ok: true, role: 'guru', user: { id: t.id, name: t.name } } : { ok: false };
            },
            async load() { return this.view(this.read()); },
            async saveCore(core) {
                if (MS.role !== 'admin') throw new Error('forbidden');
                const d = this.read();
                if (core.admin && core.admin.username) d.admin = { username: core.admin.username, password: core.admin.password || d.admin.password };
                d.students = core.students; d.teachers = core.teachers;
                const ids = new Set(d.students.map(s => s.id));

            async saveCells(key, cells) {

                const g = d.grades[key] = d.grades[key] || {};

                    else (g[c.sid] = g[c.sid] || {})[c.col] = c.val;
                });
                this.write(d); return { ok: true };
            }

        async function msSaveSiswa() {
            const f = MSUI.form; f.name = f.name.trim(); f.cls = msCls(f.cls); f.nis = f.nis.trim();

            if (f.id) { const i = MS.data.students.findIndex(s => s.id === f.id); MS.data.students[i] = { ...f }; }
            else MS.data.students.push({ ...f, id: msId('S') });
            MSUI.modal = null; if (await msSaveCore()) toast('✅ Data siswa disimpan.'); render();
        }
        async function msDelSiswa(id) {
            const s = MS.data.students.find(x => x.id === id); if (!s) return;

            MS.data.students = MS.data.students.filter(x => x.id !== id);

        }
        function msImportSiswa(inp) {
            const f = inp.files[0]; if (!f) return; const rd = new FileReader();
            const pick = (o, re) => { const k = Object.keys(o).find(k => re.test(k.toLowerCase())); return k ? String(o[k]).trim() : ''; };
            const done = async (rows) => {
                const list = rows.map(o => ({ nis: pick(o, /nis/), name: pick(o, /nama/), cls: msCls(pick(o, /kelas/)), jk: pick(o, /jenis|kelamin|^jk/).toUpperCase().slice(0, 1), ttl: pick(o, /lahir|ttl/) })).filter(s => s.name && s.cls && !/^contoh/i.test(s.name));
                let add = 0, upd = 0;
                list.forEach(n => {
                    const ex = MS.data.students.find(s => (n.nis && s.nis === n.nis) || (!n.nis && s.name.toLowerCase() === n.name.toLowerCase() && s.cls === n.cls));
                    if (ex) { Object.assign(ex, n); upd++; } else { MS.data.students.push({ ...n, id: msId('S') }); add++; }
                });
                if (!list.length) { toast('⚠️ Tidak ada data siswa yang terbaca. Cek kolom NISN, Nama, Kelas.'); return; }
                if (await msSaveCore()) toast(`✅ ${add} siswa ditambah, ${upd} diperbarui.`); render();
            };
            if (/\.csv$/i.test(f.name)) { rd.onload = () => done(csvRows(rd.result)); rd.readAsText(f); }
            else if (window.XLSX) { rd.onload = () => { const wb = XLSX.read(rd.result, { type: 'array' }); done(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' })); }; rd.readAsArrayBuffer(f); }
            else toast('⚠️ Pembaca Excel butuh internet. Simpan file sebagai CSV lalu impor lagi.');
            inp.value = '';
        }
        const msCsv = (rows) => '\uFEFF' + rows.map(r => r.map(v => '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"').join(';')).join('\n');
        function msExportSiswa() {
            const rows = [['NISN', 'Nama', 'Kelas', 'JK', 'TTL']].concat(MS.data.students.slice().sort((a, b) => msSort(a.cls, b.cls) || msSort(a.name, b.name)).map(s => [s.nis, s.name, s.cls, s.jk, s.ttl]));

        function msGenPw() { const ch = 'abcdefghjkmnpqrstuvwxyz23456789'; let p = ''; for (let i = 0; i < 6; i++) p += ch[Math.floor(Math.random() * ch.length)]; MSUI.form.password = p; render(); }
        async function msSaveGuru() {

        // --- Tab Input Nilai (guru & admin) ---
        function msAssigns() { return MS.role === 'admin' ? null : ((MS.data.teachers[0] || {}).assigns || []).slice().sort((a, b) => msSort(a.cls, b.cls) || msSort(a.mapel, b.mapel)); }

            } else {
                const cl = msClasses();
                if (!cl.includes(MSUI.cls)) MSUI.cls = cl[0] || '';
                if (!MAPEL.includes(MSUI.mapel)) MSUI.mapel = MAPEL[0];
            }
            return { cls: MSUI.cls, mapel: MSUI.mapel };
        }
        const msCols = () => ASSESS.slice(0, MSUI.uhN).concat(['UTS', 'UAS']);
        const msStudents = (cls) => MS.data.students.filter(s => s.cls === cls).sort((a, b) => msSort(a.name, b.name));
        function msAvg(g) { const v = Object.values(g || {}).filter(x => typeof x === 'number'); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10 : null; }
        function msFilled(cls, mapel) { const g = MS.data.grades[msKey(cls, mapel)] || {}; return msStudents(cls).filter(s => g[s.id] && Object.keys(g[s.id]).length).length; }
        // Cari hasil ulangan online (selesai) per siswa + UH untuk kelas & mapel yang sedang dipilih (satu kali per render)
        function ulIndex(cls, mapel) {
            let all = []; try { all = Storage.loadResults(); } catch (e) {}
            const idx = {};
            all.filter(r => r.status === 'done' && r.mapel === mapel && msCls(r.cls) === cls && /^\d+$/.test(String(r.uh))).forEach(r => {
                const k = String(r.name).trim().toLowerCase() + '|UH' + r.uh;
                if (!idx[k] || String(r.finishTime || '') > String(idx[k].finishTime || '')) idx[k] = r;
            });
            return (name, col) => { const r = idx[String(name).trim().toLowerCase() + '|' + col]; return r && canDetail(r) ? r : null; };
        }
        function msNilaiTab() {
            const A = msAssigns(), { cls, mapel } = msSel();
            let head = '';
            if (A) {
                head = A.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${A.map(a => `<button class="${a.cls === cls && a.mapel === mapel ? '' : 'secondary'}" style="${smallBtn}" onclick="msPick('${esc(a.cls)}','${esc(a.mapel)}')">${esc(a.cls)} · ${esc(a.mapel)} (${msFilled(a.cls, a.mapel)}/${msStudents(a.cls).length})</button>`).join('')}</div>`
                    : '<p style="color:var(--text-muted)">Akun Anda belum diberi kelas dan mata pelajaran. Hubungi admin.</p>';
            } else {
                head = `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px"><select onchange="msPick(this.value,MSUI.mapel)" style="width:auto;margin:0">${msClasses().map(c => `<option ${c === cls ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
                    <select onchange="msPick(MSUI.cls,this.value)" style="width:auto;margin:0">${MAPEL.map(m => `<option ${m === mapel ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></div>`;
            }
            if (!cls) return `<h3>Input Nilai</h3>${head}<p style="color:var(--text-muted)">Belum ada kelas atau siswa. ${MS.role === 'admin' ? 'Isi dulu di tab Siswa.' : ''}</p>`;
            const S = msStudents(cls), cols = msCols(), g = MS.data.grades[msKey(cls, mapel)] || {}, ulf = ulIndex(cls, mapel);
            return `<h3>Input Nilai</h3>${head}
                <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px">
                    <b>${esc(cls)} · ${esc(mapel)}</b><span style="color:var(--text-muted)" id="ms-stat">${msStat(cls, mapel)}</span><span id="ms-status" style="font-weight:700;color:var(--success)">${esc(MSUI.status)}</span>

                <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
                    <button class="secondary" style="${smallBtn}" onclick="if(MSUI.uhN<10){MSUI.uhN++;render()}">➕ Kolom UH</button>

                    <button class="secondary" style="${smallBtn}" onclick="msExportNilai()">📤 Ekspor CSV</button>
                </div>
                <p style="color:var(--text-muted);font-size:0.85rem;margin-top:0">Isi nilai 0–100. Tekan Enter atau panah bawah untuk pindah ke siswa berikutnya. Nilai tersimpan otomatis. Tombol 🔍 di samping nilai UH menampilkan soal mana yang benar dan salah (muncul bila siswa mengerjakan ulangan online).</p>
                <div class="table-responsive"><table class="data-table"><thead><tr><th>#</th><th>Nama</th>${cols.map(c => `<th style="text-align:center">${asLabel(c)}</th>`).join('')}<th style="text-align:center">Rata-rata</th></tr></thead><tbody>
                    ${S.length ? S.map((s, i) => `<tr><td>${i + 1}</td><td><b>${esc(s.name)}</b></td>${cols.map(c => { const rr = ulf(s.name, c); return `<td><div style="display:flex;align-items:center;justify-content:center;gap:4px"><input class="ms-in" id="g-${i}-${c}" type="number" min="0" max="100" step="any" inputmode="decimal" value="${g[s.id] && g[s.id][c] !== undefined ? g[s.id][c] : ''}" style="width:78px;padding:8px;margin:0;text-align:center" onchange="msSet('${s.id}','${c}',this)" onkeydown="msKeyNav(event,${i},'${c}')">${rr ? `<button type="button" title="Lihat soal benar / salah" aria-label="Keterangan soal ${esc(s.name)} ${asLabel(c)}" style="width:auto;margin:0;padding:4px 8px;min-height:36px;font-size:0.9rem" onclick="openDetail('${rr.id}')">🔍</button>` : ''}</div></td>`; }).join('')}<td style="text-align:center" id="avg-${s.id}"><b>${msAvg(g[s.id]) === null ? '-' : msAvg(g[s.id])}</b></td></tr>`).join('') : '<tr><td colspan="' + (cols.length + 3) + '" style="text-align:center;color:var(--text-muted)">Belum ada siswa di kelas ini.</td></tr>'}
                </tbody></table></div>`;
        }
        function msStat(cls, mapel) {
            const S = msStudents(cls), g = MS.data.grades[msKey(cls, mapel)] || {};
            const all = S.map(s => msAvg(g[s.id])).filter(x => x !== null);
            return `· terisi ${msFilled(cls, mapel)}/${S.length} siswa · rata-rata kelas ${all.length ? Math.round(all.reduce((a, b) => a + b, 0) / all.length * 10) / 10 : '-'}`;
        }
        function msPick(cls, mapel) { msFlush(); MSUI.cls = cls; MSUI.mapel = mapel; render(); }
        function msKeyNav(e, i, c) {
            const d = e.key === 'Enter' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;

            const n = document.getElementById('g-' + (i + d) + '-' + c); if (n) { n.focus(); n.select(); } else e.target.blur();
        }
        function msSet(sid, col, el) {
            const { cls, mapel } = msSel(), key = msKey(cls, mapel), g = (MS.data.grades[key] = MS.data.grades[key] || {});
            const raw = el.value.trim(), prev = g[sid] && g[sid][col] !== undefined ? g[sid][col] : '';
            let val = null;

            if (val === null) { if (g[sid]) { delete g[sid][col]; if (!Object.keys(g[sid]).length) delete g[sid]; } } else (g[sid] = g[sid] || {})[col] = val;
            const a = msAvg(g[sid]), ae = document.getElementById('avg-' + sid); if (ae) ae.innerHTML = '<b>' + (a === null ? '-' : a) + '</b>';
            const st = document.getElementById('ms-stat'); if (st) st.textContent = msStat(cls, mapel);

        function msQueue(key, sid, col, val) {

            MSUI.status = '⏳ Menyimpan...'; msStatus();

        function msStatus() { const el = document.getElementById('ms-status'); if (el) el.textContent = MSUI.status; }
        async function msFlush() {
            clearTimeout(MSUI.timer);
            const keys = Object.keys(MSUI.pending); if (!keys.length) return;
            const batch = MSUI.pending; MSUI.pending = {};
            try { for (const k of keys) await msApi().saveCells(k, Object.values(batch[k])); MSUI.status = '✅ Tersimpan'; }
            catch (e) {
                if (/forbidden/.test(String(e && e.message))) { MSUI.status = '⛔ Tidak diizinkan menyimpan nilai ini.'; }
                else {
                    keys.forEach(k => Object.values(batch[k]).forEach(c => { const p = (MSUI.pending[k] = MSUI.pending[k] || {}); if (!p[c.sid + '|' + c.col]) p[c.sid + '|' + c.col] = c; }));
                    MSUI.status = '⚠️ Gagal menyimpan, mencoba lagi...'; MSUI.timer = setTimeout(msFlush, 5000);
                }
            }
            msStatus();
        }
        window.addEventListener('pagehide', () => { if (MS.data) msFlush(); });
        function msFetchOnline() {
            const { cls, mapel } = msSel(), key = msKey(cls, mapel); let all = [];
            try { all = Storage.loadResults(); } catch (e) {}
            all = all.filter(r => r.status === 'done' && r.mapel === mapel && msCls(r.cls) === cls);
            const g = (MS.data.grades[key] = MS.data.grades[key] || {}); let n = 0;
            msStudents(cls).forEach(s => {
                all.filter(r => String(r.name).trim().toLowerCase() === s.name.trim().toLowerCase()).forEach(r => {
                    const col = 'UH' + r.uh; if (!ASSESS.includes(col) || col === 'UTS' || col === 'UAS') return;
                    if (g[s.id] && g[s.id][col] !== undefined) return;
                    (g[s.id] = g[s.id] || {})[col] = r.score; msQueue(key, s.id, col, r.score); n++;

                });

            toast(n ? `✅ ${n} nilai diambil dari ulangan online.` : 'ℹ️ Tidak ada nilai online baru yang cocok (nama dan kelas harus sama).'); render();
        }

            msStudents(cls).forEach((s, i) => rows.push([i + 1, s.nis, s.name].concat(cols.map(c => g[s.id] && g[s.id][c] !== undefined ? g[s.id][c] : ''), [msAvg(g[s.id]) === null ? '' : msAvg(g[s.id])])));

/* ---- deteksi keluar halaman (anti false-positive, selaras dengan ujian utama) ---- */
const pause=ms=>{graceUntil=Math.max(graceUntil,Date.now()+(ms||4000))};
["touchstart","pointerdown","click","keydown","input","scroll"].forEach(ev=>window.addEventListener(ev,()=>{lastInt=Date.now()},{passive:true,capture:true}));
const active=()=>scr==="exam"&&!!S&&!ROOT.hidden&&!away;
function reallyAway(){if(document.hidden)return true;if(Date.now()-lastInt<1200)return false;return !document.hasFocus()}
function sched(){
  if(!active()||vt)return;
  vt=setTimeout(()=>{vt=null;if(!active()||Date.now()<graceUntil)return;if(reallyAway())strike()},1500);
}
function back(){if(vt){clearTimeout(vt);vt=null}pause(1500)}
function strike(){
  if(!active())return;
  away=true;S.vio=(S.vio||0)+1;save();
  if(S.vio>MAXV){finish("vio");vOverlay("Pelanggaran ke-"+S.vio+". Ujian dikumpulkan otomatis.",true);return}
  vOverlay(`Kamu meninggalkan halaman ujian (${S.vio}/${MAXV}). ${S.vio===MAXV?"Ini peringatan TERAKHIR! Keluar sekali lagi, ujian otomatis dikumpulkan.":"Sisa kesempatan: "+(MAXV-S.vio)+"."}`,false);
}
function vOverlay(msg,final){
  const o=$("#tk-vio");if(o)o.remove();
  const d=document.createElement("div");d.id="tk-vio";d.className="xb-lock vio";

["fullscreenchange","webkitfullscreenchange"].forEach(ev=>document.addEventListener(ev,()=>{pause(2500);if(!ROOT.hidden&&scr==="exam")fsCheck()}));

/* ---- pembatasan saat ujian ---- */
const examOn=()=>!ROOT.hidden&&scr==="exam"&&!!S;
["contextmenu","copy","cut","paste","dragstart","selectstart"].forEach(ev=>document.addEventListener(ev,e=>{if(examOn())e.preventDefault()},true));
document.addEventListener("keydown",e=>{
  if(!examOn())return;
  const k=(e.key||"").toLowerCase(),c=e.ctrlKey||e.metaKey;
  if(k==="f12"||k==="printscreen"||(c&&e.shiftKey&&["i","j","c","s"].includes(k))||(c&&["u","s","p","c","x","v","a"].includes(k))){e.preventDefault();return}
  if($("#tk-mdl")||$("#tk-fs")||$("#tk-vio")||$("#tk-zoom")){if(k==="escape")TKA.zx();return}
  if(c||e.altKey)return;
  if(k==="arrowright"){e.preventDefault();go(S.cur+1)}
  else if(k==="arrowleft"){e.preventDefault();go(S.cur-1)}
  else if(k==="r"){dbt()}
  else if(/^[a-h]$/.test(k)){
    const q=cq();if(q.ty==="mj")return;
    const od=ordOf(qx(),q.o.length),d=L.toLowerCase().indexOf(k);
    if(d>=0&&d<od.length){q.ty==="pg"?setPG(od[d]):setPK(od[d])}
  }
},true);

/* ================= UJIAN ================= */
function start(){
  const P=curPk();
  if(sudah(sessionStorage.tkaN,sessionStorage.tkaK,pick,P.id)){alert(TOLAK);home();return}
  const o=mkOrder(P,CF());
  S={m:pick,p:P.id,name:sessionStorage.tkaN,cls:sessionStorage.tkaK,ans:P.soal.map(init),doubt:[],cur:0,t0:Date.now(),end:Date.now()+P.menit*60000,qo:o.qo,oo:o.oo,vio:0};
  RES=null;rf="all";skipFs=false;away=false;lastRi=-1;
  if(!save())xtoast("⚠️ Penyimpanan perangkat penuh atau nonaktif. Jawaban tidak bisa dipulihkan bila halaman dimuat ulang.");
  enterFs();begin();
}
function resume(){
  S=ls.g("tka_run");if(!S)return;
  if(!BANK[S.m]){ls.d("tka_run");S=null;home();return}
  if(!S.p)S.p=PS(S.m)[0].id;
  const P=PS(S.m).find(p=>p.id===S.p);
  if(!P||P.soal.length!==S.ans.length){alert("Paket soal ini sudah diubah atau dihapus, jadi ujian tidak bisa dilanjutkan.");ls.d("tka_run");S=null;home();return}
  if(S.end<=Date.now()){finish("time");return}
  S.cur=Math.min(S.cur||0,P.soal.length-1);S.vio=S.vio||0;
  RES=null;skipFs=false;away=false;lastRi=-1;
  enterFs();begin();
}
function begin(){
  scr="exam";const l=S.end-Date.now();warned={m5:l<=300000,m1:l<=60000};pause(4000);
  if(!trap){trap=true;try{history.pushState({tka:1},"")}catch(e){}}
  startTimer();render();
}
function startTimer(){clearInterval(tmr);tmr=setInterval(tick,1000)}
function tick(){
  if(ROOT.hidden)return;
  const c=$("#tk-clock"),n=$("#tk-net");
  if(c)c.textContent=clock();
  if(n){const h=netTx();if(n.innerHTML!==h)n.innerHTML=h;n.classList.toggle("bad",!navigator.onLine)}
  if(scr!=="exam"||!S)return;
  const left=S.end-Date.now(),e=$("#tk-tm");
  if(e){e.textContent=fmt(left);e.parentNode.classList.toggle("low",left<5*60000)}
  if(left<=0){finish("time");return}
  if(left<=60000&&!warned.m1){warned.m1=true;warned.m5=true;xtoast("⏰ Sisa waktu kurang dari 1 menit!")}
  else if(left<=300000&&!warned.m5){warned.m5=true;xtoast("⏰ Sisa waktu 5 menit.")}
}

function go(k){const n=gP(S.m,S.p).soal.length;if(k<0||k>=n)return;S.cur=k;save();render()}
function setPG(j){S.ans[qx()]=j;save();render()}

function open(){
  ROOT.hidden=false;document.body.style.overflow="hidden";applyFs();
  clearInterval(tmr);tmr=setInterval(tick,1000);
  if(scr==="exam"&&S&&S.end>Date.now()){render();return}
  if(scr==="result"&&RES&&S){showResult();return}
  const rn=ls.g("tka_run");
  /* ujian yang waktunya habis saat halaman ditutup dikumpulkan otomatis agar tidak menggantung */
  if(rn&&rn.end<=Date.now()&&BANK[rn.m]){
    const P=PS(rn.m).find(p=>p.id===(rn.p||PS(rn.m)[0].id));
    if(P&&P.soal.length===rn.ans.length){S=rn;if(!S.p)S.p=P.id;finish("time");return}
    ls.d("tka_run");
  }
  home();
}
function close(){
  A.ok=false;

  clearInterval(tmr);tmr=null;exitFs();
  ["#tk-fs","#tk-vio","#tk-mdl"].forEach(s=>{const d=$(s);if(d)d.remove()});
  scr="home";ROOT.hidden=true;document.body.style.overflow="";
}

function pie(d){

  return`<div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 200 200" width="200" height="200">${s}</svg><div>${d.map(x=>`<div><span style="display:inline-block;width:.9rem;height:.9rem;border-radius:4px;background:${x.c};vertical-align:middle"></span> ${x.l}: <b>${+x.v.toFixed(1)}</b> (${Math.round(x.v/T*100)}%)</div>`).join("")}</div></div>`;

const wcard=()=>`<div class="rv" style="background:var(--prl);border-left:4px solid var(--pr);margin-bottom:1rem"><b>📄 Input soal dengan Word</b>

<li>Unduh format, lalu buka di Microsoft Word.</li>
<li>Isi baris <b>Mapel</b> dengan <b>Matematika</b> atau <b>Bahasa Indonesia</b>. Bila dikosongkan, soal masuk ke mata uji dan paket yang sedang dipilih di bawah.</li>
<li>Tulis soal dengan penanda <b>[PG]</b> atau <b>[PK]</b>, lalu <b>Soal:</b>, pilihan <b>A.</b> sampai <b>F.</b>, dan <b>Kunci:</b>. PK: <b>Kunci: A,C</b>.</li>

</ol><div class="mu" style="margin-top:.4rem;font-size:.85rem">Baris UH dan Kelas di file Word tidak dipakai di TKA. Soal bertipe lain (IS, DD, MJ, FL) dilewati.</div></details></div>`;
function wimp(){
  const i=document.createElement("input");i.type="file";i.accept=".docx";
  i.onchange=()=>{const f=i.files[0];if(!f)return;if(!/\.docx$/i.test(f.name)){alert("Pilih file Word berformat .docx (bukan .doc).");return}
    const rd=new FileReader();rd.onload=()=>wproc(rd.result);rd.readAsArrayBuffer(f)};
  i.click();
}
async function wproc(buf){
  if(!window.JSZip||typeof wordRows!=="function"||typeof wordImages!=="function"){alert("Pembaca Word butuh internet. Sambungkan internet lalu coba lagi.");return}
  let rows;
  try{const zip=await JSZip.loadAsync(buf),f=zip.file("word/document.xml");if(!f)throw 0;rows=await wordImages(zip,wordRows(await f.async("string")))}
  catch(e){alert("File Word tidak bisa dibaca. Pakai file .docx dari tombol Unduh Format Word.");return}
  wconv(rows);
}
function wconv(rows){
  const mapOf=v=>{const x=String(v||"").toLowerCase();return /mat|numerasi/.test(x)?"mat":/indo|literasi|^bahasa$/.test(x)?"bin":""};
  const out={mat:[],bin:[]},errs=[];let dup=0;
  for(let i=1;i<rows.length;i++){
    const r=rows[i],nm=rows.names[i],im=(rows.imgs&&rows.imgs[i])||{},oim=im.oimg||[],ty=String(r[0]).toLowerCase();
    if(ty!=="pg"&&ty!=="pk"){errs.push(nm+": TKA hanya menerima PG dan PK");continue}
    const rawM=String(r[1]||"").trim(),m=rawM?mapOf(rawM):A.mp;
    if(!m){errs.push(nm+': Mapel "'+rawM+'" tidak dikenal (pakai Matematika atau Bahasa Indonesia)');continue}
    const t=String(r[5]||"").trim();if(!t){errs.push(nm+": Soal kosong");continue}
    const fl=[];for(let j=0;j<12;j++){const v=String(r[6+j]||"").trim();if(v||oim[j])fl.push({v,j})}
    if(fl.length<2){errs.push(nm+": minimal 2 pilihan");continue}
    if(fl.length>8){errs.push(nm+": maksimal 8 pilihan");continue}
    const kk=String(r[18]||"").trim(),pos=x=>{x=x.trim().toUpperCase();return /^[A-F]$/.test(x)?fl.findIndex(y=>y.j===x.charCodeAt(0)-65):-1};
    const q={ty,t,o:fl.map(x=>x.v)};
    if(ty==="pg"){const a=pos(kk);if(a<0){errs.push(nm+": Kunci PG harus satu huruf dari pilihan yang terisi");continue}q.a=a}
    else{const rw=/^[A-Fa-f]+$/.test(kk.replace(/\s/g,""))?kk.replace(/\s/g,"").split(""):kk.split(/[,;|\s]+/).filter(Boolean);
      const ks=[...new Set(rw.map(pos))];if(!ks.length||ks.some(x=>x<0)){errs.push(nm+": Kunci PK harus huruf pilihan, contoh A,C");continue}q.ks=ks.sort((a,b)=>a-b)}
    const oi=fl.map(x=>oim[x.j]||"");if(oi.some(Boolean))q.oimg=oi;
    if(im.img)q.img=im.img;
    const tx=String(r[4]||"").trim();if(tx)q._tx=tx;
    if(tgtP(m).soal.some(x=>x.ty===ty&&x.t===t)||out[m].some(x=>x.ty===ty&&x.t===t)){dup++;continue}
    out[m].push(q);
  }
  const n=out.mat.length+out.bin.length,ni=out.mat.concat(out.bin).filter(q=>q.img||q.oimg).length;
  const notes=(rows.sampleCount?"\n"+rows.sampleCount+" baris contoh dilewati.":"")+(dup?"\n"+dup+" soal sama persis (sudah ada) dilewati.":"")
    +(rows.lostImgs?"\n⚠️ "+rows.lostImgs+" gambar tidak terbaca atau salah letak (cek aturan gambar di format Word).":"")
    +(errs.length?"\n\n"+errs.length+" soal bermasalah dan tidak diimpor:\n"+errs.slice(0,6).map(e=>"- "+e).join("\n")+(errs.length>6?"\n... dan "+(errs.length-6)+" lainnya":""):"");
  if(!n){alert("Tidak ada soal yang bisa diimpor."+notes);return}
  const det=["mat","bin"].filter(k=>out[k].length).map(k=>"• "+BANK[k].nama+" ("+tgtP(k).nama+"): "+out[k].length+" soal").join("\n");
  if(!confirm("Ditemukan "+n+" soal siap diimpor ke TKA:\n"+det+(ni?"\n🖼️ "+ni+" soal memuat gambar.":"")+notes+"\n\nImpor soal yang valid sekarang?"))return;
  let u=0;
  ["mat","bin"].forEach(k=>out[k].forEach(q=>{
    if(q._tx){let key=Object.keys(STIM).find(x=>STIM[x]===q._tx);if(!key){key="w"+Date.now().toString(36)+(u++);STIM[key]=q._tx}q.s=key}
    delete q._tx;tgtP(k).soal.push(q);
  }));
  saveBank();A.mp=out.mat.length?"mat":"bin";A.tab="sl";panel();
}
const shr=(f,max,cb)=>{if(!f)return;if(!f.type||f.type.indexOf("image/")!==0){alert("File harus berupa gambar.");return}
  const rd=new FileReader();rd.onload=()=>imgShrink(rd.result,max,.7).then(d=>{if(!d){alert("Gambar tidak dapat dibaca.");return}cb(d)});rd.readAsDataURL(f)};

function swimp(){
  const i=document.createElement("input");i.type="file";i.accept=".xlsx,.xls,.csv";
  i.onchange=()=>{const f=i.files[0];if(!f)return;const rd=new FileReader();
    const done=rows=>{
      const pick=(o,re)=>{const k=Object.keys(o).find(k=>re.test(String(k).toLowerCase()));return k?String(o[k]).trim():""};
      const list=rows.map(o=>({nis:pick(o,/^nis|induk/),name:pick(o,/nama/),cls:pick(o,/kelas/),jk:pick(o,/jenis|kelamin|^jk|^l\/p/),ttl:pick(o,/lahir|ttl/)})).filter(s=>s.name&&!/^contoh/i.test(s.name));
      if(!list.length){alert("Tidak ada data siswa yang terbaca. Pakai format dari tombol Unduh Format Excel (kolom NISN, Nama Lengkap, Kelas, ...).");return}
      const S=swLoad(),idx={};S.forEach((s,k)=>idx[String(s.name+"|"+s.cls).toLowerCase()]=k);let add=0,upd=0;
      list.forEach(s=>{const id=String(s.name+"|"+s.cls).toLowerCase();if(idx[id]!==undefined){S[idx[id]]=Object.assign({},S[idx[id]],s);upd++}else{idx[id]=S.push(s)-1;add++}});
      swSave(S);alert("✅ Impor selesai: "+add+" siswa baru, "+upd+" diperbarui.");panel();
    };
    if(/\.csv$/i.test(f.name)){if(typeof csvRows!=="function"){alert("Pembaca CSV tidak tersedia.");return}rd.onload=()=>done(csvRows(rd.result));rd.readAsText(f)}
    else if(window.XLSX){rd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:"array"});done(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""}))}catch(e){alert("File Excel tidak bisa dibaca. Pakai format dari tombol Unduh Format Excel.")}};rd.readAsArrayBuffer(f)}
    else alert("Pembaca Excel butuh internet. Simpan file sebagai CSV lalu impor lagi.");
  };i.click();
}
function swexp(){
  const S=swLoad();if(!S.length){alert("Belum ada data siswa.");return}
  const rows=[["NISN","Nama Lengkap","Kelas","Jenis Kelamin","Tempat, Tanggal Lahir"]].concat(S.map(s=>[s.nis||"",s.name,s.cls||"",s.jk||"",s.ttl||""]));
  if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=[{wch:16},{wch:36},{wch:10},{wch:16},{wch:28}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Data Siswa");XLSX.writeFile(wb,"data_siswa.xlsx");return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\n")],{type:"text/csv"}));a.download="data_siswa.csv";a.click();
}
function swsave(){
  const f=A.sf||swEmpty(),name=(f.name||"").trim(),cls=(f.cls||"").trim();
  if(!name||!cls){alert("Nama lengkap dan kelas wajib diisi.");return}
  const S=swLoad(),id=String(name+"|"+cls).toLowerCase();
  if(S.some((s,k)=>k!==f.i&&String(s.name+"|"+s.cls).toLowerCase()===id)){alert("Siswa dengan nama dan kelas yang sama sudah ada.");return}
  const rec={nis:(f.nis||"").trim(),name,cls,jk:f.jk==="P"?"P":"L",ttl:f.ttl||""};
  if(f.i>=0)S[f.i]=Object.assign({},S[f.i],rec);else S.push(rec);
  swSave(S);A.sf=swEmpty();panel();
}

<script>
/* ===== Lintas perangkat: layar tetap menyala saat ujian ===== */
(function(){
  /* Web biasa (bukan aplikasi): bersihkan service worker/cache lama bila pernah terpasang */
  try{
    if("serviceWorker" in navigator){
      navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){});
    }
    if(window.caches&&caches.keys){
      caches.keys().then(function(ks){ks.filter(function(k){return k.indexOf("ujian-v")===0}).forEach(function(k){caches.delete(k)})}).catch(function(){});
    }
  }catch(e){}

  /* Layar tetap menyala selama ujian (tablet/HP). Diam-diam diabaikan jika browser tidak mendukung. */
  try{
    if("wakeLock" in navigator){
      var lock=null;
      var perlu=function(){
        if(document.hidden)return false;
        if(document.body&&document.body.classList.contains("exam-mode"))return true;
        var r=document.getElementById("tka-root");return !!(r&&!r.hidden);
      };
      var cek=function(){
        if(perlu()&&!lock){
          navigator.wakeLock.request("screen").then(function(l){
            lock=l;l.addEventListener("release",function(){lock=null});
          }).catch(function(){});
        }else if(!perlu()&&lock){try{lock.release()}catch(e){}lock=null}
      };
      setInterval(cek,4000);
      document.addEventListener("visibilitychange",function(){if(!document.hidden)setTimeout(cek,300)});
    }
  }catch(e){}
})();
</script>
