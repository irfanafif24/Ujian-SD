                ${f.blocks.map((b, i) => `<div style="border:1px solid var(--border);border-radius:16px;padding:10px;margin-bottom:10px">
                    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
                        <input type="text" list="ms-cls-list" placeholder="Kelas (mis. 5A)" value="${esc(b.cls)}" oninput="MSUI.form.blocks[${i}].cls=this.value" style="margin-bottom:0">
                        <button class="danger" style="${smallBtn}" onclick="MSUI.form.blocks.splice(${i},1);render()">X</button>
                    </div>
                    <div style="display:flex;flex-wrap:wrap;gap:6px">${MAPEL.map(m => `<button class="${b.mapels.includes(m) ? 'success' : 'secondary'}" style="${smallBtn}" onclick="msToggleMapel(${i},'${m}')">${m}</button>`).join('')}</div>
                </div>`).join('')}
                <datalist id="ms-cls-list">${msClasses().map(c => `<option value="${esc(c)}">`).join('')}</datalist>
                <button class="secondary" style="${smallBtn}" onclick="MSUI.form.blocks.push({cls:'',mapels:[]});render()">➕ Tambah Kelas</button>
                <div style="display:flex;gap:12px;margin-top:16px"><button class="secondary" onclick="MSUI.modal=null;render()">Batal</button><button class="success" onclick="msSaveGuru()">Simpan</button></div>
            </div></div>`;
        }
        function msToggleMapel(i, m) { const a = MSUI.form.blocks[i].mapels, k = a.indexOf(m); if (k >= 0) a.splice(k, 1); else a.push(m); render(); }
        function msGenPw() { const ch = 'abcdefghjkmnpqrstuvwxyz23456789'; let p = ''; for (let i = 0; i < 6; i++) p += ch[Math.floor(Math.random() * ch.length)]; MSUI.form.password = p; render(); }
        async function msSaveGuru() {
            const f = MSUI.form; f.name = f.name.trim(); f.username = f.username.trim(); f.password = f.password.trim();
            if (!f.name) { toast('⚠️ Nama guru wajib diisi!'); return; }
            if (!/^[A-Za-z0-9._-]{3,}$/.test(f.username)) { toast('⚠️ Username minimal 3 karakter: huruf, angka, titik, minus, atau garis bawah.'); return; }
            if (f.password.length < 4) { toast('⚠️ Password minimal 4 karakter!'); return; }
            const lu = f.username.toLowerCase();
            if (MS.data.teachers.some(t => t.id !== f.id && String(t.username).toLowerCase() === lu) || String(MS.data.admin.username || '').toLowerCase() === lu) { toast('⚠️ Username sudah dipakai!'); return; }
            const seen = new Set(), assigns = [];
            f.blocks.forEach(b => { const c = msCls(b.cls); if (!c) return; b.mapels.forEach(m => { const k = msKey(c, m); if (!seen.has(k)) { seen.add(k); assigns.push({ cls: c, mapel: m }); } }); });
            const rec = { id: f.id || msId('G'), name: f.name, username: f.username, password: f.password, assigns };
            if (f.id) { const i = MS.data.teachers.findIndex(t => t.id === f.id); MS.data.teachers[i] = rec; } else MS.data.teachers.push(rec);
            MSUI.modal = null; if (await msSaveCore()) toast('✅ Data guru disimpan.'); render();
        }
        async function msDelGuru(id) {
            const t = MS.data.teachers.find(x => x.id === id); if (!t) return;
            if (!confirm('Hapus akun guru "' + t.name + '"? Nilai yang sudah diinput tetap tersimpan.')) return;
            MS.data.teachers = MS.data.teachers.filter(x => x.id !== id);
            if (await msSaveCore()) toast('🗑️ Guru dihapus.'); render();
        }

        // --- Tab Input Nilai (guru & admin) ---
        function msAssigns() { return MS.role === 'admin' ? null : ((MS.data.teachers[0] || {}).assigns || []).slice().sort((a, b) => msSort(a.cls, b.cls) || msSort(a.mapel, b.mapel)); }
        function msSel() {
            const A = msAssigns();
            if (A) {
                if (!A.some(a => a.cls === MSUI.cls && a.mapel === MSUI.mapel)) { MSUI.cls = A[0] ? A[0].cls : ''; MSUI.mapel = A[0] ? A[0].mapel : ''; }
            } else {
                const cl = msClasses();
                if (!cl.includes(MSUI.cls)) MSUI.cls = cl[0] || '';
                if (!MAPEL.includes(MSUI.mapel)) MSUI.mapel = MAPEL[0];
            }
            return { cls: MSUI.cls, mapel: MSUI.mapel };
        }
        const msCols = () => ASSESS.slice(0, MSUI.uhN).concat(['UTS', 'UAS']);
        const msStudents = (cls) => MS.data.students.filter(s => s.cls === cls).sort((a, b) => msSort(a.name, b.name));
        function msAvg(g) { const v = Object.values(g || {}).filter(x => typeof x === 'number'); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10 : null; }
        function msFilled(cls, mapel) { const g = MS.data.grades[msKey(cls, mapel)] || {}; return msStudents(cls).filter(s => g[s.id] && Object.keys(g[s.id]).length).length; }
        // Cari hasil ulangan online (selesai) per siswa + UH untuk kelas & mapel yang sedang dipilih (satu kali per render)
        function ulIndex(cls, mapel) {
            let all = []; try { all = Storage.loadResults(); } catch (e) {}
            const idx = {};
            all.filter(r => r.status === 'done' && r.mapel === mapel && msCls(r.cls) === cls && /^\d+$/.test(String(r.uh))).forEach(r => {
                const k = String(r.name).trim().toLowerCase() + '|UH' + r.uh;
                if (!idx[k] || String(r.finishTime || '') > String(idx[k].finishTime || '')) idx[k] = r;
            });
            return (name, col) => { const r = idx[String(name).trim().toLowerCase() + '|' + col]; return r && canDetail(r) ? r : null; };
        }
        function msNilaiTab() {
            const A = msAssigns(), { cls, mapel } = msSel();
            let head = '';
            if (A) {
                head = A.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${A.map(a => `<button class="${a.cls === cls && a.mapel === mapel ? '' : 'secondary'}" style="${smallBtn}" onclick="msPick('${esc(a.cls)}','${esc(a.mapel)}')">${esc(a.cls)} · ${esc(a.mapel)} (${msFilled(a.cls, a.mapel)}/${msStudents(a.cls).length})</button>`).join('')}</div>`
                    : '<p style="color:var(--text-muted)">Akun Anda belum diberi kelas dan mata pelajaran. Hubungi admin.</p>';
            } else {
                head = `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px"><select onchange="msPick(this.value,MSUI.mapel)" style="width:auto;margin:0">${msClasses().map(c => `<option ${c === cls ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
                    <select onchange="msPick(MSUI.cls,this.value)" style="width:auto;margin:0">${MAPEL.map(m => `<option ${m === mapel ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></div>`;
            }
            if (!cls) return `<h3>Input Nilai</h3>${head}<p style="color:var(--text-muted)">Belum ada kelas atau siswa. ${MS.role === 'admin' ? 'Isi dulu di tab Siswa.' : ''}</p>`;
            const S = msStudents(cls), cols = msCols(), g = MS.data.grades[msKey(cls, mapel)] || {}, ulf = ulIndex(cls, mapel);
            return `<h3>Input Nilai</h3>${head}
                <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px">
                    <b>${esc(cls)} · ${esc(mapel)}</b><span style="color:var(--text-muted)" id="ms-stat">${msStat(cls, mapel)}</span><span id="ms-status" style="font-weight:700;color:var(--success)">${esc(MSUI.status)}</span>
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
                    <button class="secondary" style="${smallBtn}" onclick="if(MSUI.uhN<10){MSUI.uhN++;render()}">➕ Kolom UH</button>
                    <button class="secondary" style="${smallBtn}" onclick="msFetchOnline()">📥 Ambil nilai ulangan online</button>
                    <button class="secondary" style="${smallBtn}" onclick="msExportNilai()">📤 Ekspor CSV</button>
                </div>
                <p style="color:var(--text-muted);font-size:0.85rem;margin-top:0">Isi nilai 0–100. Tekan Enter atau panah bawah untuk pindah ke siswa berikutnya. Nilai tersimpan otomatis. Tombol 🔍 di samping nilai UH menampilkan soal mana yang benar dan salah (muncul bila siswa mengerjakan ulangan online).</p>
                <div class="table-responsive"><table class="data-table"><thead><tr><th>#</th><th>Nama</th>${cols.map(c => `<th style="text-align:center">${asLabel(c)}</th>`).join('')}<th style="text-align:center">Rata-rata</th></tr></thead><tbody>
                    ${S.length ? S.map((s, i) => `<tr><td>${i + 1}</td><td><b>${esc(s.name)}</b></td>${cols.map(c => { const rr = ulf(s.name, c); return `<td><div style="display:flex;align-items:center;justify-content:center;gap:4px"><input class="ms-in" id="g-${i}-${c}" type="number" min="0" max="100" step="any" inputmode="decimal" value="${g[s.id] && g[s.id][c] !== undefined ? g[s.id][c] : ''}" style="width:78px;padding:8px;margin:0;text-align:center" onchange="msSet('${s.id}','${c}',this)" onkeydown="msKeyNav(event,${i},'${c}')">${rr ? `<button type="button" title="Lihat soal benar / salah" aria-label="Keterangan soal ${esc(s.name)} ${asLabel(c)}" style="width:auto;margin:0;padding:4px 8px;min-height:36px;font-size:0.9rem" onclick="openDetail('${rr.id}')">🔍</button>` : ''}</div></td>`; }).join('')}<td style="text-align:center" id="avg-${s.id}"><b>${msAvg(g[s.id]) === null ? '-' : msAvg(g[s.id])}</b></td></tr>`).join('') : '<tr><td colspan="' + (cols.length + 3) + '" style="text-align:center;color:var(--text-muted)">Belum ada siswa di kelas ini.</td></tr>'}
                </tbody></table></div>`;
        }
        function msStat(cls, mapel) {
            const S = msStudents(cls), g = MS.data.grades[msKey(cls, mapel)] || {};
            const all = S.map(s => msAvg(g[s.id])).filter(x => x !== null);
            return `· terisi ${msFilled(cls, mapel)}/${S.length} siswa · rata-rata kelas ${all.length ? Math.round(all.reduce((a, b) => a + b, 0) / all.length * 10) / 10 : '-'}`;
        }
        function msPick(cls, mapel) { msFlush(); MSUI.cls = cls; MSUI.mapel = mapel; render(); }
        function msKeyNav(e, i, c) {
            const d = e.key === 'Enter' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
            if (!d) return; e.preventDefault();
            const n = document.getElementById('g-' + (i + d) + '-' + c); if (n) { n.focus(); n.select(); } else e.target.blur();
        }
        function msSet(sid, col, el) {
            const { cls, mapel } = msSel(), key = msKey(cls, mapel), g = (MS.data.grades[key] = MS.data.grades[key] || {});
            const raw = el.value.trim(), prev = g[sid] && g[sid][col] !== undefined ? g[sid][col] : '';
            let val = null;
            if (raw !== '') { const n = msNum(raw); if (isNaN(n) || n < 0 || n > 100) { toast('⚠️ Nilai harus 0 sampai 100!'); el.value = prev; return; } val = Math.round(n * 100) / 100; el.value = val; }
            if (val === null) { if (g[sid]) { delete g[sid][col]; if (!Object.keys(g[sid]).length) delete g[sid]; } } else (g[sid] = g[sid] || {})[col] = val;
            const a = msAvg(g[sid]), ae = document.getElementById('avg-' + sid); if (ae) ae.innerHTML = '<b>' + (a === null ? '-' : a) + '</b>';
            const st = document.getElementById('ms-stat'); if (st) st.textContent = msStat(cls, mapel);
            msQueue(key, sid, col, val);
        }
        function msQueue(key, sid, col, val) {
            (MSUI.pending[key] = MSUI.pending[key] || {})[sid + '|' + col] = { sid, col, val };
            MSUI.status = '⏳ Menyimpan...'; msStatus();
            clearTimeout(MSUI.timer); MSUI.timer = setTimeout(msFlush, 600);
        }
        function msStatus() { const el = document.getElementById('ms-status'); if (el) el.textContent = MSUI.status; }
        async function msFlush() {
            clearTimeout(MSUI.timer);
            const keys = Object.keys(MSUI.pending); if (!keys.length) return;
            const batch = MSUI.pending; MSUI.pending = {};
            try { for (const k of keys) await msApi().saveCells(k, Object.values(batch[k])); MSUI.status = '✅ Tersimpan'; }
            catch (e) {
                if (/forbidden/.test(String(e && e.message))) { MSUI.status = '⛔ Tidak diizinkan menyimpan nilai ini.'; }
                else {
                    keys.forEach(k => Object.values(batch[k]).forEach(c => { const p = (MSUI.pending[k] = MSUI.pending[k] || {}); if (!p[c.sid + '|' + c.col]) p[c.sid + '|' + c.col] = c; }));
                    MSUI.status = '⚠️ Gagal menyimpan, mencoba lagi...'; MSUI.timer = setTimeout(msFlush, 5000);
                }
            }
            msStatus();
        }
        window.addEventListener('pagehide', () => { if (MS.data) msFlush(); });
        function msFetchOnline() {
            const { cls, mapel } = msSel(), key = msKey(cls, mapel); let all = [];
            try { all = Storage.loadResults(); } catch (e) {}
            all = all.filter(r => r.status === 'done' && r.mapel === mapel && msCls(r.cls) === cls);
            const g = (MS.data.grades[key] = MS.data.grades[key] || {}); let n = 0;
            msStudents(cls).forEach(s => {
                all.filter(r => String(r.name).trim().toLowerCase() === s.name.trim().toLowerCase()).forEach(r => {
                    const col = 'UH' + r.uh; if (!ASSESS.includes(col) || col === 'UTS' || col === 'UAS') return;
                    if (g[s.id] && g[s.id][col] !== undefined) return;
                    (g[s.id] = g[s.id] || {})[col] = r.score; msQueue(key, s.id, col, r.score); n++;
                    const u = +col.slice(2); if (u > MSUI.uhN) MSUI.uhN = u;
                });
            });
            toast(n ? `✅ ${n} nilai diambil dari ulangan online.` : 'ℹ️ Tidak ada nilai online baru yang cocok (nama dan kelas harus sama).'); render();
        }
        function msExportNilai() {
            const { cls, mapel } = msSel(), cols = msCols(), g = MS.data.grades[msKey(cls, mapel)] || {};
            const rows = [[`Nilai ${mapel} - Kelas ${cls}`], ['No', 'NISN', 'Nama'].concat(cols.map(asLabel), ['Rata-rata'])];
            msStudents(cls).forEach((s, i) => rows.push([i + 1, s.nis, s.name].concat(cols.map(c => g[s.id] && g[s.id][c] !== undefined ? g[s.id][c] : ''), [msAvg(g[s.id]) === null ? '' : msAvg(g[s.id])])));
            saveFile(`nilai_${mapel.replace(/\s+/g, '_')}_${cls}.csv`, new Blob([msCsv(rows)], { type: 'text/csv' }));
        }

        // --- Tab Rekap ---
        function msRekapData() {
            const A = msAssigns(), cl = A ? [...new Set(A.map(a => a.cls))].sort(msSort) : msClasses();
            if (!cl.includes(MSUI.rcls)) MSUI.rcls = cl[0] || '';
            const maps = A ? A.filter(a => a.cls === MSUI.rcls).map(a => a.mapel) : MAPEL.filter(m => msFilled(MSUI.rcls, m) > 0);
            return { cl, maps };
        }
        function msRekapTab() {
            const { cl, maps } = msRekapData(), cls = MSUI.rcls;
            if (!cls) return '<h3>Rekap Nilai</h3><p style="color:var(--text-muted)">Belum ada data.</p>';
            const S = msStudents(cls);
            const rows = S.map((s, i) => { const av = maps.map(m => msAvg((MS.data.grades[msKey(cls, m)] || {})[s.id])); const ok = av.filter(x => x !== null); return { s, av, tot: ok.length ? Math.round(ok.reduce((a, b) => a + b, 0) / ok.length * 10) / 10 : null }; });
            return `<h3>Rekap Nilai per Kelas</h3>
                <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px"><select onchange="MSUI.rcls=this.value;render()" style="width:auto;margin:0">${cl.map(c => `<option ${c === cls ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
                    <button class="secondary" style="${smallBtn}" onclick="msExportRekap()">📤 Ekspor CSV</button></div>
                <div class="table-responsive"><table class="data-table"><thead><tr><th>#</th><th>Nama</th>${maps.map(m => `<th style="text-align:center">${esc(m)}</th>`).join('')}<th style="text-align:center">Rata-rata</th></tr></thead><tbody>
                    ${rows.length ? rows.map((r, i) => `<tr><td>${i + 1}</td><td><b>${esc(r.s.name)}</b></td>${r.av.map(x => `<td style="text-align:center">${x === null ? '-' : x}</td>`).join('')}<td style="text-align:center"><b>${r.tot === null ? '-' : r.tot}</b></td></tr>`).join('') : '<tr><td colspan="' + (maps.length + 3) + '" style="text-align:center;color:var(--text-muted)">Belum ada siswa.</td></tr>'}
                </tbody></table></div>
                ${maps.length ? '' : '<p style="color:var(--text-muted)">Belum ada nilai yang diinput untuk kelas ini.</p>'}`;
        }
        function msExportRekap() {
            const { maps } = msRekapData(), cls = MSUI.rcls, rows = [['No', 'NISN', 'Nama'].concat(maps, ['Rata-rata'])];
            msStudents(cls).forEach((s, i) => { const av = maps.map(m => msAvg((MS.data.grades[msKey(cls, m)] || {})[s.id])), ok = av.filter(x => x !== null); rows.push([i + 1, s.nis, s.name].concat(av.map(x => x === null ? '' : x), [ok.length ? Math.round(ok.reduce((a, b) => a + b, 0) / ok.length * 10) / 10 : ''])); });
            saveFile(`rekap_nilai_${cls}.csv`, new Blob([msCsv(rows)], { type: 'text/csv' }));
        }

        // --- Tab Akun (admin) ---
        function msAkunTab() {
            return `<h3>Akun Admin</h3>
                <p style="color:var(--text-muted);font-size:0.9rem">Ganti username dan password admin. Kosongkan kolom password jika tidak ingin menggantinya.</p>
                <label>Username Admin</label><input type="text" id="ms-au" autocapitalize="none" value="${esc(MS.data.admin.username || 'admin')}">
                <label>Password Baru</label><input type="text" id="ms-ap" placeholder="(tidak diganti)">
                <button class="success" onclick="msSaveAkun()">Simpan Akun</button>`;
        }
        async function msSaveAkun() {
            const u = document.getElementById('ms-au').value.trim(), p = document.getElementById('ms-ap').value.trim();
            if (!/^[A-Za-z0-9._-]{3,}$/.test(u)) { toast('⚠️ Username minimal 3 karakter tanpa spasi.'); return; }
            if (p && p.length < 6) { toast('⚠️ Password baru minimal 6 karakter!'); return; }
            if (MS.data.teachers.some(t => String(t.username).toLowerCase() === u.toLowerCase())) { toast('⚠️ Username sudah dipakai guru!'); return; }
            MSUI.newAdmin = { username: u }; if (p) MSUI.newAdmin.password = p;
            if (await msSaveCore()) { MS.data.admin.username = u; if (p) MS.data.admin.password = p; toast('✅ Akun admin disimpan.'); } render();
        }


        // ===== Lanjut ujian otomatis: jawaban, posisi soal & waktu tetap tersimpan =====
        function persistProgress() {
            try {
                if (state.page !== 'exam' || !state.result || state.result.status === 'done') return;
                state.result.cq = state.currentQ;
                const rs = JSON.parse(localStorage.getItem('ujian_res') || '[]');
                const i = rs.findIndex(x => x.id === state.result.id);
                if (i >= 0) rs[i] = state.result; else rs.push(state.result);
                localStorage.setItem('ujian_res', JSON.stringify(rs));
            } catch (e) {}
        }

        // Waktu saat melanjutkan: berhenti jika siswa pergi tanpa pelanggaran (mis. gangguan sistem),
        // tetap berjalan jika siswa pergi karena pelanggaran (pindah tab / keluar halaman).
        function resumeEnd(r) {
            let end;
            if (r.awayAt && r.endAt) end = r.endAt;
            else {
                let rem = Number(r.remainingMs); if (!isFinite(rem) || rem < 0) rem = 0;
                try { const x = JSON.parse(localStorage.getItem('ujian_rem') || 'null'); if (x && x.id === r.id && isFinite(x.rem) && x.rem >= 0) rem = Math.min(rem, x.rem); } catch (e) {}
                end = Date.now() + rem;
            }
            r.endAt = end; r.awayAt = null; r.remainingMs = Math.max(0, end - Date.now());
            return end;
        }

        function tryAutoResume() {
            try {
                const id = localStorage.getItem('ujian_active'); if (!id) return false;
                const r = JSON.parse(localStorage.getItem('ujian_res') || '[]').find(x => x.id === id);
                if (!r || r.status !== 'progress' || !Array.isArray(r.savedQuestionsOrder) || !r.savedQuestionsOrder.length) { localStorage.removeItem('ujian_active'); return false; }
                state.tid = r.tid; config = Storage.loadConfig(r.tid);
                state.studentName = r.name; state.studentClass = r.cls; state.studentMapel = r.mapel; state.studentUH = r.uh;
                state.result = r; state.questions = r.savedQuestionsOrder;
                state.endTime = resumeEnd(r);
                state.currentQ = Math.min(Math.max(+r.cq || 0, 0), state.questions.length - 1);
                state.page = 'exam'; state.isExamActive = true;
                startTimer(); persistProgress(); cheatPause(CHEAT_GRACE_MS);
                return true;
            } catch (e) { return false; }
        }
        // Simpan seketika saat halaman ditutup / disembunyikan (mis. jawaban isian yang belum sempat tersimpan)
        window.addEventListener('pagehide', persistProgress);
        window.addEventListener('beforeunload', persistProgress);
        document.addEventListener('visibilitychange', () => { if (document.hidden) persistProgress(); });

        function bootApp() {
            if (window.__booted) return;
            window.__booted = true;
            const resumed = tryAutoResume();
            try { render(); } catch (e) { console.error(e); const a = document.getElementById('app'); if (a) a.innerHTML = '<div style="margin:24px auto;max-width:560px;padding:20px;border:2px solid #ef4444;border-radius:16px;background:#fff;color:#111"><b>⚠️ Gagal menampilkan halaman</b><br>' + esc(e && e.message) + '</div>'; }
            try { cloudInit(); } catch (e) { console.error(e); }
            setNetState(true);
            if (resumed) toast('▶️ Melanjutkan ulangan. Jawabanmu masih tersimpan.');
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootApp);
        else bootApp();
        window.addEventListener('load', bootApp);
    </script>
</body>
</html>
